# The gate. One job, because `make check` already is the gate: a second
# workflow that ran half of it would be a second definition of "passing" for
# someone to forget to update.
#
# Everything here mirrors what a contributor runs locally. If CI and a laptop
# can disagree about whether a change is good, the corpus has stopped being the
# contract and the build has become it.

name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Every action is pinned to a FULL-LENGTH COMMIT SHA, which this organisation
# requires and which is right anyway: a tag is a movable label, and `@v4` means
# "whatever that label points at when this runs" - a third party's future
# commit, trusted in advance, with the repository's own contents in scope.
#
# The version each SHA was at when it was pinned is in the comment beside it.
# Bumping one means resolving the new SHA and updating both.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version: '1.24'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The generated SDKs are not published to any language registry yet, so
      # there is no lockfile that can hold them. `make sdk` clones each at the
      # revision spec/sources.aontu pins, and `sdk-check` - which every port
      # target depends on - fails the build if a clone drifts off its pin.
      - name: Clone the generated SDKs at their pinned revisions
        run: make sdk

      - name: Install the TypeScript port's dependencies
        run: npm install
        working-directory: typescript

      # station, sekreto and plugin publish no Python package. `make py-deps`
      # clones each at the revision python/deps.json pins and builds the
      # port's venv from them and python/requirements.txt; `make check` runs it
      # again, and it then only verifies the pins.
      - name: Build the Python port's dependencies
        run: make py-deps

      # The schema and its data, every port against both corpora, the
      # cross-port byte comparison, and the comparison's own self-test.
      - name: make check
        run: make check
