[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "likeness"
version = "0.1.0"
description = "likeness, Python port"
license = "MIT"
requires-python = ">=3.11"
# Assembled by `make py-deps` from requirements.txt and the checkouts deps.json
# pins; station, sekreto, plugin and the SDKs are on no package index.
dependencies = []

[project.scripts]
likeness = "likeness.cli:entry"
likeness-py = "likeness.cli:entry"

[tool.setuptools.packages.find]
include = ["likeness*"]

# The run-time specification ships inside the package, so an installed port
# reads no file from a checkout.
[tool.setuptools.package-data]
"likeness.spec" = ["*.json"]
